# Netlify Configuration for Analytics Dashboard
[build]
  base = "analytics-backend/analytics-dashboard"
  command = "npm ci && npm run build"
  publish = "dist"

# Environment variables (set these in Netlify dashboard)
[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

# Redirect all routes to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co; img-src 'self' data: https:; frame-src 'none';"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Basic Authentication (Optional - for extra security)
# Remove this section if you want to use Supabase Auth only
# [[redirects]]
#   from = "/*"
#   to = "/.netlify/functions/auth"
#   status = 200
#   force = true
#   conditions = {Cookie = "!auth"}

# Development context
[context.development]
  command = "npm run build"
  
[context.development.environment]
  NODE_ENV = "development"

# Production context
[context.production]
  command = "npm run build"
  
[context.production.environment]
  NODE_ENV = "production"

# Deploy previews
[context.deploy-preview]
  command = "npm run build"
