[build]
  # Install dependencies and build command
  command = "npm install && npm run build:netlify"
  
  # Directory to publish (where the built files are)
  publish = "dist"
  
  # Node.js version
  [build.environment]
    NODE_VERSION = "18"

[build.processing]
  # Enable image optimization
  skip_processing = false

[build.processing.css]
  # Minify CSS
  bundle = true
  minify = true

[build.processing.js]
  # Minify JavaScript
  bundle = true
  minify = true

[build.processing.html]
  # Minify HTML
  pretty_urls = true

# Redirect rules - Order matters! Specific rules first, then fallback

# 301 Redirects from legacy subdomain to primary domain
# This ensures SEO value is preserved when moving from curlea.netlify.app to curlea.beauty
[[redirects]]
  from = "https://curlea.netlify.app/*"
  to = "https://curlea.beauty/:splat"
  status = 301
  force = true

# Ensure assets are NOT redirected (served directly)
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true

# SPA fallback for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
      # Content Security Policy
      Content-Security-Policy = """
        default-src 'self';
        img-src 'self' https://images.unsplash.com https://lovable.dev https://*.stripe.com data: blob:;
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;
        media-src 'self' https://cdn.pixabay.com blob:;
        connect-src 'self' https: blob: https://*.stripe.com;
        base-uri 'self';
        form-action 'self' https://checkout.stripe.com;
        object-src 'none';
        frame-src https://checkout.stripe.com https://hooks.stripe.com;
      """
    
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    
    # Performance headers (default for routes) - don't cache HTML
    Cache-Control = "no-cache, no-store, must-revalidate"
    
    # CORS headers (if needed)
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Specific headers for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers for CSS files
[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "text/css; charset=utf-8"

# Headers for JavaScript files
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

# Headers for HTML files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Headers for video files
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    Accept-Ranges = "bytes"

# Headers for images
[[headers]]
  for = "/*.{png,jpg,jpeg,gif,webp,svg,ico}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Functions (if you plan to add serverless functions later)
[functions]
  directory = "netlify/functions"
