[build]
  # Install dependencies and build command
  command = "npm install && npm run build:netlify"
  
  # Directory to publish (where the built files are)
  publish = "dist"
  
  # Node.js version
  [build.environment]
    NODE_VERSION = "18"

[build.processing]
  # Enable image optimization
  skip_processing = false

[build.processing.css]
  # Minify CSS
  bundle = true
  minify = true

[build.processing.js]
  # Minify JavaScript
  bundle = true
  minify = true

[build.processing.html]
  # Minify HTML
  pretty_urls = true

# Redirect rules for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy
    Content-Security-Policy = """
      default-src 'self';
      img-src 'self' https://images.unsplash.com https://lovable.dev data: blob:;
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;
      media-src 'self' https://cdn.pixabay.com blob:;
      connect-src 'self' https: blob:;
      base-uri 'self';
      form-action 'self';
      object-src 'none';
      frame-src 'none';
    """
    
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-XSS-Protection = "1; mode=block"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"
    
    # Performance headers
    Cache-Control = "public, max-age=31536000, immutable"
    
    # CORS headers (if needed)
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

# Specific headers for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers for HTML files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Headers for video files
[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
    Accept-Ranges = "bytes"

# Headers for images
[[headers]]
  for = "/*.{png,jpg,jpeg,gif,webp,svg,ico}"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Functions (if you plan to add serverless functions later)
[functions]
  directory = "netlify/functions"
